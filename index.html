        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 30px;
        }
        .card-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .form-group input:focus, .form-group select:focus {

            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .quote-type-group, .delivery-mode-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .quote-type-item, .delivery-mode-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .quote-type-item:hover, .delivery-mode-item:hover { border-color: #667eea; background: #f0f4ff; }
        .quote-type-item.active, .delivery-mode-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .quote-type-item input[type="radio"], .delivery-mode-item input[type="radio"] { display: none; }
        .quote-type-item .icon, .delivery-mode-item .icon { font-size: 1.8rem; margin-bottom: 8px; }
        .quote-type-item .label, .delivery-mode-item .label { font-size: 0.9rem; font-weight: 500; }
        .quote-type-item .desc, .delivery-mode-item .desc { font-size: 0.75rem; opacity: 0.7; margin-top: 4px; }
        .autocomplete-container { position: relative; }
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            border: 2px solid #e0e0e0;
            border-top: none;
            border-radius: 0 0 10px 10px;
            background: white;
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .autocomplete-list.active { display: block; }
        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .autocomplete-item:hover { background: #f0f4ff; }
        .autocomplete-item.highlight { background: #667eea; color: white; }
        .btn-calculate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .result-section { display: none; }

        .result-title { font-size: 1.2rem; color: #333; margin-bottom: 20px; font-weight: 600; }
        .quote-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .quote-card h3 { color: #333; margin-bottom: 15px; font-size: 1.1rem; }
        .quote-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .quote-item:last-child { border-bottom: none; }
        .quote-item label { color: #666; font-size: 0.9rem; }
        .quote-item .value { font-weight: 600; color: #333; }
        .quote-item .value.highlight { color: #667eea; font-size: 1.3rem; }
        .total-row {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .total-row .value { color: white; font-size: 1.5rem; }
        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 15px;
            margin-top: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #856404;
        }
        .hidden { display: none !important; }
        .disabled { opacity: 0.5; pointer-events: none; }

            .header h1 { font-size: 1.8rem; }
            .quote-type-group, .delivery-mode-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>❄️ 鑫勇冷链报价计算器</h1>
            <p>输入货物信息，快速获取专业报价</p>
        </div>
        <div class="main-content">
            <div class="card">
                <div class="card-title"><span>📦</span> 货物信息</div>
                <div class="form-group">
                    <label>报价类型</label>
                    <div class="quote-type-group">
                        <label class="quote-type-item active">
                            <input type="radio" name="quoteType" value="line" checked>
                            <div class="icon">🚛</div>
                            <div class="label">干线报价</div>
                        </label>
                        <label class="quote-type-item">
                            <input type="radio" name="quoteType" value="delivery">
                            <div class="icon">📦</div>
                            <div class="label">共配报价（省内）</div>
                        </label>
                        <label class="quote-type-item">
                            <input type="radio" name="quoteType" value="storage">
                            <div class="icon">🏭</div>
                            <div class="label">仓储报价</div>
                        </label>
                    </div>
                </div>
                <div class="form-group" id="deliveryModeGroup">
                    <label>配送方式</label>
                    <div class="delivery-mode-group">
                        <label class="delivery-mode-item active">
                            <input type="radio" name="deliveryMode" value="self" checked>
                            <div class="icon">👤</div>
                            <div class="label">自提</div>
                            <div class="desc">客户自提</div>
                        </label>
                        <label class="delivery-mode-item">
                            <input type="radio" name="deliveryMode" value="normal">
                            <div class="icon">🚚</div>
                            <div class="label">普通送货</div>
                            <div class="desc">3吨以上免费</div>
                        </label>
                        <label class="delivery-mode-item">
                            <input type="radio" name="deliveryMode" value="temp">
                            <div class="icon">🌡️</div>
                            <div class="label">测温送货</div>
                            <div class="desc">5吨以下400元</div>
                        </label>
                    </div>
                </div>
                <div class="form-group line-delivery-field">
                    <label for="destination">到站</label>
                    <div class="autocomplete-container">
                        <input type="text" id="destination" placeholder="请输入目的地城市" autocomplete="off">
                        <div class="autocomplete-list" id="autocompleteList"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="weight">重量 (kg)</label>
                    <input type="number" id="weight" placeholder="请输入货物重量" min="0" step="0.1">
                </div>
                <div class="form-group">
                    <label for="volume">体积 (立方米)</label>
                    <input type="number" id="volume" placeholder="请输入货物体积" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label for="pieces">件数</label>
                    <input type="number" id="pieces" placeholder="请输入货物件数" min="1" step="1">
                </div>
                <div class="form-group storage-field hidden">
                    <label for="storageDays">仓储天数</label>
                    <input type="number" id="storageDays" placeholder="请输入仓储天数" min="1" step="1" value="1">
                </div>
                <div class="form-group storage-field hidden">
                    <label for="storagePallets">仓储板数</label>
                    <input type="number" id="storagePallets" placeholder="请输入仓储板数" min="1" step="1" value="1">
                </div>
                <button class="btn-calculate" onclick="calculateQuote()">🎯 计算报价</button>
            </div>

                        <div class="quote-item"><label>实际体积</label><span class="value" id="actualVolume">-</span></div>
                        <div class="quote-item"><label>重量折算件数</label><span class="value" id="weightPieces">-</span></div>
                        <div class="quote-item"><label>体积折算件数</label><span class="value" id="volumePieces">-</span></div>
                        <div class="quote-item"><label>计费件数</label><span class="value highlight" id="chargePieces">-</span></div>
                        <div class="quote-item"><label>计费方式</label><span class="value" id="chargeMethod">-</span></div>
                    </div>
                    <div class="quote-card delivery-field hidden">
                        <h3>📊 配送明细</h3>

                        <div class="quote-item"><label>货物重量</label><span class="value" id="deliveryWeight">-</span></div>
                        <div class="quote-item"><label>起步价(200kg内)</label><span class="value" id="deliveryBasePrice">-</span></div>

                    </div>
                    <div class="quote-card storage-field hidden">

                        <div class="quote-item"><label>仓储天数</label><span class="value" id="storageDaysResult">-</span></div>
                        <div class="quote-item"><label>仓储板数</label><span class="value" id="storagePalletsResult">-</span></div>
                        <div class="quote-item"><label>货物重量</label><span class="value" id="storageWeight">-</span></div>
                    </div>
                    <div class="quote-card">
                        <h3>💵 费用明细</h3>
                        <div class="quote-item line-field"><label>干线运费</label><span class="value" id="lineCost">-</span></div>
                        <div class="quote-item delivery-fee-field"><label>配送费用</label><span class="value" id="deliveryModeCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>冷藏费</label><span class="value" id="coldStorageCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>处置费</label><span class="value" id="disposalCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>搬运费（入库）</label><span class="value" id="handlingInCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>搬运费（出库）</label><span class="value" id="handlingOutCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>打膜费</label><span class="value" id="filmCost">-</span></div>
                        <div class="quote-item delivery-cost-field hidden"><label>共配费用</label><span class="value" id="deliveryCost">-</span></div>
                    </div>
                    <div id="timingSection" class="quote-card">
                        <h3>⏱️ 预计时效</h3>
                        <div class="quote-item">
                            <label>目的地</label>
                            <span class="value" id="timingDestination">-</span>
                        </div>
                        <div class="quote-item">
                            <label>预计到达天数</label>
                            <span class="value highlight" id="timingDays">-</span>
                        </div>
                        <div class="quote-item">
                            <label>物流方式</label>
                            <span class="value" id="timingLogistics">-</span>
                        </div>
                        <div class="quote-item pickup-address-field">
                            <label>提货地址</label>
                            <span class="value" id="pickupAddress">-</span>
                        </div>
                    </div>
                    <div class="total-row quote-item">
                        <label>💰 合计报价</label>
                        <span class="value" id="totalCost">-</span></div>
                    <div class="info-box">⚠️ 以上报价仅供参考，最终报价以客服确认为准。时效为预计天数，实际到达时间可能受天气、路况等因素影响。</div>
                    <div class="info-box" style="margin-top:10px;background:#f8f9fa;">📌 以上报价为全年固定零担价格，不含税，开票需要加收9%税点。</div>
                </div>
                <div id="emptyState" style="text-align: center; padding: 40px 0;">
                    <div style="font-size: 4rem; margin-bottom: 15px;">📭</div>
                    <p style="color: #999;">请选择报价类型并输入货物信息</p>
                    <p style="color: #ccc; font-size: 0.9rem;">点击计算按钮获取报价</p>
                </div>
            </div>
        </div>
    </div>

        function handleQuoteTypeChange() {
            const quoteType = document.querySelector('input[name="quoteType"]:checked').value;
            document.querySelectorAll('.line-field').forEach(f => f.classList.toggle('hidden', quoteType !== 'line'));
            document.querySelectorAll('.storage-field').forEach(f => f.classList.toggle('hidden', quoteType !== 'storage'));
            document.querySelectorAll('.delivery-field').forEach(f => f.classList.toggle('hidden', quoteType !== 'delivery'));
            document.querySelectorAll('.delivery-cost-field').forEach(f => f.classList.toggle('hidden', quoteType !== 'delivery'));
            document.querySelectorAll('.line-delivery-field').forEach(f => f.classList.toggle('hidden', quoteType === 'storage'));
            document.querySelectorAll('.quote-type-item').forEach(item => item.classList.toggle('active', item.querySelector('input').checked));
            
            const deliveryModeGroup = document.getElementById('deliveryModeGroup');
            const nonDeliveryFields = document.querySelectorAll('.delivery-fee-field');
            
            if (quoteType === 'delivery') {
                document.querySelector('input[name="deliveryMode"][value="normal"]').checked = true;
                document.querySelectorAll('.delivery-mode-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.querySelector('input[value="normal"]')) {
                        item.classList.add('active');
                    }
                });
                deliveryModeGroup.classList.add('disabled');
                nonDeliveryFields.forEach(f => f.classList.add('hidden'));
            } else {

        function updateDeliveryFeeVisibility() {
            const quoteType = document.querySelector('input[name="quoteType"]:checked').value;
            const deliveryMode = document.querySelector('input[name="deliveryMode"]:checked').value;
            const deliveryFeeFields = document.querySelectorAll('.delivery-fee-field');

        function setupAutocomplete() {

            const list = document.getElementById('autocompleteList');

            input.addEventListener('input', function() {
                const value = this.value.toLowerCase();
                selectedIndex = -1;
                if (!value) { list.classList.remove('active'); return; }
                
                // 根据报价类型选择不同的城市列表
                const quoteType = document.querySelector('input[name="quoteType"]:checked').value;
                const availableDestinations = quoteType === 'delivery' ? guangdongCities : allDestinations;
                
                const matches = availableDestinations.filter(dest => dest.toLowerCase().includes(value));
                if (matches.length === 0) { list.classList.remove('active'); return; }
                
                list.innerHTML = matches.map(dest => '<div class="autocomplete-item">' + dest + '</div>').join('');
                list.classList.add('active');
                
                list.querySelectorAll('.autocomplete-item').forEach((item, index) => {
                    item.addEventListener('click', function() { input.value = this.textContent; list.classList.remove('active'); });
                    item.addEventListener('mouseenter', function() { selectedIndex = index; updateHighlight(); });
                });
            });
            
            input.addEventListener('keydown', function(e) {
                const items = list.querySelectorAll('.autocomplete-item');
                if (!list.classList.contains('active') || items.length === 0) return;
                
                if (e.key === 'ArrowDown') { e.preventDefault(); selectedIndex = Math.min(selectedIndex + 1, items.length - 1); updateHighlight(); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); selectedIndex = Math.max(selectedIndex - 1, 0); updateHighlight(); }
                else if (e.key === 'Enter' && selectedIndex >= 0) { e.preventDefault(); input.value = items[selectedIndex].textContent; list.classList.remove('active'); }
                else if (e.key === 'Escape') { list.classList.remove('active'); }
            });
            
            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !list.contains(e.target)) list.classList.remove('active');
            });
            
            function updateHighlight() {
                list.querySelectorAll('.autocomplete-item').forEach((item, index) => item.classList.toggle('highlight', index === selectedIndex));
            }
        }
        
        function calculateQuote() {
            const quoteType = document.querySelector('input[name="quoteType"]:checked').value;
            const deliveryMode = document.querySelector('input[name="deliveryMode"]:checked').value;
            const weight = parseFloat(document.getElementById('weight').value) || 0;
            const volume = parseFloat(document.getElementById('volume').value) || 0;
            const pieces = parseInt(document.getElementById('pieces').value) || 1;
            const destination = document.getElementById('destination').value.trim();
            
            if ((quoteType === 'line' || quoteType === 'delivery') && !destination) { alert('请输入目的地'); return; }
            if (quoteType === 'storage' && weight <= 0 && volume <= 0) { alert('请输入重量或体积'); return; }
            if ((quoteType === 'line' || quoteType === 'delivery') && weight <= 0 && volume <= 0) { alert('请输入重量或体积'); return; }
            
            // 共配报价验证：只能选择广东省内城市
            if (quoteType === 'delivery' && !guangdongCities.includes(destination)) {
                alert('共配报价仅支持广东省内城市，请选择：\n' + guangdongCities.join('、'));
                return;
            }
            
            let totalCost = 0, lineCost = 0, deliveryCost = 0, deliveryModeCost = 0;
            let coldStorageCost = 0, disposalCost = 0, handlingInCost = 0, handlingOutCost = 0, filmCost = 0;
            let chargePieces = 0, chargeMethod = '';
            let deliveryFeeDesc = ''; // 配送费用说明
            
            // 无网点区域：东三省、大西北、山东全省
            const noNetworkProvinces = ['东三省', '大西北'];
            const noNetworkCities = [
                // 大西北
                '银川', '兰州', '西宁', '乌鲁木齐', '拉萨',
                // 东三省
                '沈阳', '大连', '鞍山', '抚顺', '本溪', '丹东', '盘锦', '长春', '吉林', '哈尔滨', '齐齐哈尔', '大庆', '牡丹江', '佳木斯',
                // 内蒙古
                '包头', '乌兰察布', '赤峰', '通辽', '鄂尔多斯',
                // 山东全省
                '济南', '青岛', '黄岛区', '烟台', '威海', '莱阳', '荣成', '德州', '青州', '临沂', '济宁', '滨州', '梁山', '日照', '聊城', '东营', '阳信', '淄博', '潍坊', '寿光', '惠民', '郓城', '昌邑市', '高密', '泰安', '诸城', '菏泽', '金乡', '滕州', '枣庄'
            ];
            const temp300Cities = ['武汉', '长沙', '厦门', '福州', '南宁', '南昌']; // 测温送货300元的城市
            
            function isNoNetworkArea(dest) {
                // 直接检查目的地是否在无网点城市列表中
                if (noNetworkCities.includes(dest)) return true;
                // 检查省份是否为东三省或大西北
                const lineQuote = quoteData.lineQuotes[dest];
                if (lineQuote && noNetworkProvinces.includes(lineQuote.province)) return true;
                return false;
            }
            
            // 计算配送方式费用（共配报价或自提不额外收取配送费）
            if (quoteType !== 'delivery' && deliveryMode !== 'self') {
                const weightTons = weight / 1000;
                
                if (deliveryMode === 'normal') {
                    // 普通送货
                    if (isNoNetworkArea(destination)) {
                        // 无网点区域：300元起步（30km内）
                        deliveryModeCost = 300;
                        deliveryFeeDesc = '30km内¥300，超出¥3/km';
                    } else if (weightTons >= 3) {
                        // 3吨以上免费
                        deliveryModeCost = 0;
                        deliveryFeeDesc = '3吨以上免费送货';
                    } else {
                        // 3吨以下（30km内）
                        let baseCost = 0;
                        if (weight <= 500) {
                            baseCost = 100;
                        } else if (weight <= 1000) {
                            baseCost = 150;
                        } else {
                            baseCost = 200; // 封顶
                        }
                        deliveryModeCost = baseCost;
                        deliveryFeeDesc = '30km内¥' + baseCost + '，超出¥3/km';
                    }
                } else if (deliveryMode === 'temp') {
                    // 测温送货
                    if (temp300Cities.includes(destination)) {
                        // 指定城市300元（50km内）
                        deliveryModeCost = 300;
                        deliveryFeeDesc = '50km内¥300，超出¥3/km';
                    } else {
                        // 其他城市400元（50km内）
                        deliveryModeCost = 400;
                        deliveryFeeDesc = '50km内¥400，超出¥3/km';
                    }
                }
            }
            
            if (quoteType === 'line') {
                const weightPieces = Math.ceil(weight / 10);
                const volumePieces = Math.ceil(volume / 0.03);
                chargePieces = Math.max(weightPieces, volumePieces, pieces);
                
                const lineQuote = quoteData.lineQuotes[destination];
                if (lineQuote) {
                    // 判断是按重量计费还是按体积计费
                    const isVolumeBased = volumePieces >= weightPieces && volumePieces >= pieces;
                    
                    // 计算体积折算重量（1吨=3方，即1方=333.33kg）
                    const volumeWeight = volume * 333.33;
                    
                    // 重量≥300kg 或 体积折算重量≥300kg（考虑浮点精度，用299.99作为阈值），按吨位/方计费
                    if (weight >= 300 || volumeWeight >= 299.99) {
                        const tonnage = weight / 1000;
                        // 判断是泡货还是重货
                        // 泡货：体积 > 重量/333.33（即1吨 > 3方）→ 按方计费
                        // 重货：体积 ≤ 重量/333.33（即1吨 ≤ 3方）→ 按吨计费
                        const isBubbleGoods = volume > weight / 333.33;
                        
                        if (isBubbleGoods) {
                            // 泡货按方计费
                            lineCost = Math.round(volume * lineQuote.perCubic);
                            chargeMethod = '泡货按方计费: ' + volume.toFixed(2) + '方 × ¥' + lineQuote.perCubic + '/方';
                        } else {
                            // 重货按吨计费
                            lineCost = Math.round(tonnage * lineQuote.over500kg);
                            chargeMethod = '重货按吨计费: ' + tonnage.toFixed(2) + '吨 × ¥' + lineQuote.over500kg + '/吨';
                        }
                    } else if (chargePieces === 1) {
                        lineCost = lineQuote.firstPiece;
                        chargeMethod = '首件价 ¥' + lineQuote.firstPiece;
                    } else if (chargePieces <= 9) {
                        lineCost = lineQuote.firstPiece + (chargePieces - 1) * lineQuote.extra2_9;
                        chargeMethod = '首件价¥' + lineQuote.firstPiece + ' + ' + (chargePieces - 1) + '件×续件单价¥' + lineQuote.extra2_9 + '/件';
                    } else if (chargePieces <= 15) {
                        lineCost = chargePieces * lineQuote.extra10_15;
                        chargeMethod = (isVolumeBased ? '泡货' : '') + chargePieces + '件 × ¥' + lineQuote.extra10_15 + '/件 (10-15件区间)';
                    } else if (chargePieces <= 30) {
                        lineCost = chargePieces * lineQuote.extra16_30;
                        chargeMethod = (isVolumeBased ? '泡货' : '') + chargePieces + '件 × ¥' + lineQuote.extra16_30 + '/件 (16-30件区间)';
                    } else if (chargePieces <= 50) {
                        lineCost = chargePieces * lineQuote.extra31_50;
                        chargeMethod = (isVolumeBased ? '泡货' : '') + chargePieces + '件 × ¥' + lineQuote.extra31_50 + '/件 (31-50件区间)';
                    } else {
                        const tonCost = Math.ceil(weight / 1000) * lineQuote.over500kg;
                        const pieceCost = chargePieces * lineQuote.extra31_50;
                        lineCost = Math.min(tonCost, pieceCost);
                        if (tonCost <= pieceCost) {
                            chargeMethod = '按吨计费: ' + Math.ceil(weight / 1000) + '吨 × ¥' + lineQuote.over500kg + '/吨';
                        } else {
                            chargeMethod = (isVolumeBased ? '泡货' : '') + '按件计费: ' + chargePieces + '件 × ¥' + lineQuote.extra31_50 + '/件';
                        }
                    }
                }
                totalCost = lineCost + deliveryModeCost;
                
                document.getElementById('actualWeight').textContent = weight.toFixed(1) + ' kg (' + (weight/1000).toFixed(2) + ' 吨)';
                document.getElementById('actualVolume').textContent = volume.toFixed(2) + ' 方';
                document.getElementById('weightPieces').textContent = weightPieces + ' 件';
                document.getElementById('volumePieces').textContent = volumePieces + ' 件';
                document.getElementById('chargePieces').textContent = chargePieces + ' 件';
                document.getElementById('chargeMethod').textContent = chargeMethod;
                
            } else if (quoteType === 'storage') {
                const storageDays = parseInt(document.getElementById('storageDays').value) || 1;
                const storagePallets = parseInt(document.getElementById('storagePallets').value) || 1;
                
                coldStorageCost = (quoteData.storageQuotes['冷藏费']?.price || 4) * storagePallets * storageDays;
                disposalCost = (quoteData.storageQuotes['处置费']?.price || 40) * Math.ceil(weight / 1000);
                handlingInCost = (quoteData.storageQuotes['搬运费（入库）']?.price || 35) * storagePallets;
                handlingOutCost = (quoteData.storageQuotes['搬运费（出库）']?.price || 35) * storagePallets;
                filmCost = (quoteData.storageQuotes['打膜费']?.price || 5) * storagePallets;
                
                totalCost = coldStorageCost + disposalCost + handlingInCost + handlingOutCost + filmCost + deliveryModeCost;
                
                document.getElementById('storageDaysResult').textContent = storageDays + ' 天';
                document.getElementById('storagePalletsResult').textContent = storagePallets + ' 板';
                document.getElementById('storageWeight').textContent = weight.toFixed(1) + ' kg';
                document.getElementById('coldStorageCost').textContent = '¥ ' + coldStorageCost;
                document.getElementById('disposalCost').textContent = '¥ ' + disposalCost;
                document.getElementById('handlingInCost').textContent = '¥ ' + handlingInCost;
                document.getElementById('handlingOutCost').textContent = '¥ ' + handlingOutCost;
                document.getElementById('filmCost').textContent = '¥ ' + filmCost;
                
            } else if (quoteType === 'delivery') {
                const region = quoteData.regionMap[destination];
                const deliveryQuote = quoteData.deliveryQuotes[region];
                
                if (deliveryQuote) {
                    // 五区（云浮）直接返回起步价350元，提示联系客户
                    if (region === '五区') {
                        deliveryCost = deliveryQuote.basePrice;
                        document.getElementById('deliveryRegion').textContent = region || '未知区域';
                        document.getElementById('deliveryWeight').textContent = weight.toFixed(1) + ' kg';
                        document.getElementById('deliveryBasePrice').textContent = '¥ ' + deliveryQuote.basePrice + ' (具体价格联系客服)';
                        document.getElementById('deliveryUnitPrice').textContent = '无续重单价';
                    } else {
                        // 重泡比1:3（1吨=3方），200kg=0.6方
                        // 超过0.6方需要将体积折算重量来计算续重
                        let calcWeight = weight;
                        if (volume > 0.6) {
                            // 体积折算重量：体积 × 333.33kg/方
                            const volumeWeight = volume * 333.33;
                            // 取实际重量和体积折算重量的较大值
                            calcWeight = Math.max(weight, volumeWeight);
                        }
                        
                        if (calcWeight <= 200) {
                            deliveryCost = deliveryQuote.basePrice;
                        } else {
                            deliveryCost = deliveryQuote.basePrice + Math.ceil(calcWeight - 200) * deliveryQuote.unitPrice;
                        }
                        
                        document.getElementById('deliveryRegion').textContent = region || '未知区域';
                        document.getElementById('deliveryWeight').textContent = weight.toFixed(1) + ' kg (计费重量: ' + calcWeight.toFixed(1) + ' kg)';
                        document.getElementById('deliveryBasePrice').textContent = '¥ ' + deliveryQuote.basePrice;
                        document.getElementById('deliveryUnitPrice').textContent = '¥ ' + deliveryQuote.unitPrice + '/kg';
                    }
                } else {
                    alert('未找到该目的地的共配报价，请检查输入的城市名称');
                    return;
                }
                totalCost = deliveryCost;
            }
            
            // 更新时效信息（包含物流方式）
            if (quoteType === 'delivery') {
                // 共配报价时效信息
                const deliveryTimingMap = {
                    '一区': '当天（市区）',
                    '二区': '24H（市区）',
                    '三区': '48H（市区）',
                    '四区': '48H（市区）',
                    '五区': '48-72H'
                };
                document.getElementById('timingDestination').textContent = destination || '-';
                document.getElementById('timingDays').textContent = deliveryTimingMap[region] || '暂无数据';
                document.getElementById('timingLogistics').textContent = '送货直达';
            } else {
                const timingInfo = quoteData.timingMap[destination];
                document.getElementById('timingDestination').textContent = destination || '-';
                document.getElementById('timingDays').textContent = timingInfo ? timingInfo.days + ' 天' : '暂无数据';
                document.getElementById('timingLogistics').textContent = timingInfo && timingInfo.logistics ? timingInfo.logistics : '暂无数据';
            }
            
            // 更新提货地址（仅自提时显示，共配报价不显示）
            const pickupAddressField = document.querySelector('.pickup-address-field');
            if (deliveryMode === 'self' && quoteType !== 'delivery') {
                pickupAddressField.classList.remove('hidden');
                document.getElementById('pickupAddress').textContent = quoteData.pickupAddressMap[destination] || '暂无数据';
            } else {
                pickupAddressField.classList.add('hidden');
            }
            
            // 更新费用显示
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('resultSection').classList.add('active');
            document.getElementById('lineCost').textContent = '¥ ' + lineCost;
            document.getElementById('deliveryCost').textContent = '¥ ' + deliveryCost;
            // 配送费用显示（带说明）
            const deliveryFeeText = deliveryModeCost > 0 ? '¥ ' + deliveryModeCost + ' <span style="font-size:0.75em;color:#999;">(' + deliveryFeeDesc + ')</span>' : (deliveryFeeDesc || '¥ 0');
            document.getElementById('deliveryModeCost').innerHTML = deliveryFeeText;
            document.getElementById('totalCost').textContent = '¥ ' + totalCost;
            
            // 更新费用明细显示
            updateDeliveryFeeVisibility();
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('input[name="quoteType"]').forEach(radio => radio.addEventListener('change', handleQuoteTypeChange));
            document.querySelectorAll('input[name="deliveryMode"]').forEach(radio => radio.addEventListener('change', handleDeliveryModeChange));
            setupAutocomplete();
            handleDeliveryModeChange();
        });
    </script>
</body>
