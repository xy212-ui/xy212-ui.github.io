    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 30px;
        }
        .card-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .quote-type-group, .delivery-mode-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .quote-type-item, .delivery-mode-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .quote-type-item:hover, .delivery-mode-item:hover { border-color: #667eea; background: #f0f4ff; }
        .quote-type-item.active, .delivery-mode-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .quote-type-item input[type="radio"], .delivery-mode-item input[type="radio"] { display: none; }
        .delivery-mode-item.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .quote-type-item .icon, .delivery-mode-item .icon { font-size: 1.8rem; margin-bottom: 8px; }
        .quote-type-item .label, .delivery-mode-item .label { font-size: 0.9rem; font-weight: 500; }
        .quote-type-item .desc, .delivery-mode-item .desc { font-size: 0.75rem; opacity: 0.7; margin-top: 4px; }
        .autocomplete-container { position: relative; }
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            border: 2px solid #e0e0e0;
            border-top: none;
            border-radius: 0 0 10px 10px;
            background: white;
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .autocomplete-list.active { display: block; }
        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .autocomplete-item:hover { background: #f0f4ff; }
        .autocomplete-item.highlight { background: #667eea; color: white; }
        .btn-calculate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-calculate:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .result-section { display: none; }
        .result-section.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-title { font-size: 1.2rem; color: #333; margin-bottom: 20px; font-weight: 600; }
        .quote-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .quote-card h3 { color: #333; margin-bottom: 15px; font-size: 1.1rem; }
        .quote-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .quote-item:last-child { border-bottom: none; }
        .quote-item label { color: #666; font-size: 0.9rem; }
        .quote-item .value { font-weight: 600; color: #333; }
        .quote-item .value.highlight { color: #667eea; font-size: 1.3rem; }
        .total-row {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .total-row .value { color: white; font-size: 1.5rem; }
        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 15px;
            margin-top: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #856404;
        }

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>❄️ 鑫勇冷链报价计算器</h1>
            <p>输入货物信息，快速获取专业报价</p>
        </div>
        <div class="main-content">
            <div class="card">
                <div class="card-title"><span>📦</span> 货物信息</div>
                <div class="form-group">
                    <label>报价类型</label>
                    <div class="quote-type-group">
                        <label class="quote-type-item active">
                            <input type="radio" name="quoteType" value="line" checked>
                            <div class="icon">🚛</div>
                            <div class="label">干线报价</div>
                        </label>
                        <label class="quote-type-item">
                            <input type="radio" name="quoteType" value="delivery">
                            <div class="icon">📦</div>
                            <div class="label">共配报价（省内）</div>
                        </label>
                        <label class="quote-type-item">
                            <input type="radio" name="quoteType" value="storage">
                            <div class="icon">🏭</div>
                            <div class="label">仓储报价</div>
                        </label>
                    </div>
                </div>
                <div class="form-group" id="deliveryModeGroup">
                    <label>配送方式</label>
                    <div class="delivery-mode-group">
                        <label class="delivery-mode-item active">
                            <input type="radio" name="deliveryMode" value="self" checked>
                            <div class="icon">👤</div>
                            <div class="label">自提</div>
                            <div class="desc">客户自提</div>
                        </label>
                        <label class="delivery-mode-item">
                            <input type="radio" name="deliveryMode" value="normal">
                            <div class="icon">🚚</div>
                            <div class="label">普通送货</div>
                            <div class="desc">3吨以上免费</div>
                        </label>
                        <label class="delivery-mode-item">
                            <input type="radio" name="deliveryMode" value="temp">
                            <div class="icon">🌡️</div>
                            <div class="label">测温送货</div>
                            <div class="desc">5吨以下400元</div>
                        </label>
                    </div>
                </div>
                <div class="form-group line-delivery-field destination-field">
                    <label for="destination">到站</label>
                    <div class="autocomplete-container">
                        <input type="text" id="destination" placeholder="请输入目的地城市" autocomplete="off">
                        <div class="autocomplete-list" id="autocompleteList"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="weight">重量 (kg)</label>
                    <input type="number" id="weight" placeholder="请输入货物重量" min="0" step="0.1">
                </div>
                <div class="form-group">
                    <label for="volume">体积 (立方米)</label>
                    <input type="number" id="volume" placeholder="请输入货物体积" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label for="pieces">件数</label>
                    <input type="number" id="pieces" placeholder="请输入货物件数" min="1" step="1">
                </div>
                <div class="form-group storage-field hidden">
                    <label for="storageDays">仓储天数</label>
                    <input type="number" id="storageDays" placeholder="请输入仓储天数" min="1" step="1" value="1">
                </div>
                <div class="form-group storage-field hidden">
                    <label for="storagePallets">仓储板数</label>
                    <input type="number" id="storagePallets" placeholder="请输入仓储板数" min="1" step="1" value="1">
                </div>
                <button class="btn-calculate" onclick="calculateQuote()">🎯 计算报价</button>
            </div>
            <div class="card">
                <div class="card-title"><span>💰</span> 报价结果</div>
                <div class="result-section" id="resultSection">
                    <div class="result-title">📋 计费明细</div>
                    <div class="quote-card line-field">
                        <h3>📊 计费依据</h3>
                        <div class="quote-item"><label>实际重量</label><span class="value" id="actualWeight">-</span></div>
                        <div class="quote-item"><label>实际体积</label><span class="value" id="actualVolume">-</span></div>
                        <div class="quote-item"><label>重量折算件数</label><span class="value" id="weightPieces">-</span></div>
                        <div class="quote-item"><label>体积折算件数</label><span class="value" id="volumePieces">-</span></div>
                        <div class="quote-item"><label>计费件数</label><span class="value highlight" id="chargePieces">-</span></div>
                        <div class="quote-item"><label>计费方式</label><span class="value" id="chargeMethod">-</span></div>
                    </div>
                    <div class="quote-card delivery-field hidden">
                        <h3>📊 配送明细</h3>
                        <div class="quote-item"><label>配送区域</label><span class="value" id="deliveryRegion">-</span></div>
                        <div class="quote-item"><label>货物重量</label><span class="value" id="deliveryWeight">-</span></div>
                        <div class="quote-item"><label>起步价(200kg内)</label><span class="value" id="deliveryBasePrice">-</span></div>
                        <div class="quote-item"><label>续重单价</label><span class="value" id="deliveryUnitPrice">-</span></div>
                    </div>
                    <div class="quote-card storage-field hidden">
                        <h3>📊 仓储明细</h3>
                        <div class="quote-item"><label>仓储天数</label><span class="value" id="storageDaysResult">-</span></div>
                        <div class="quote-item"><label>仓储板数</label><span class="value" id="storagePalletsResult">-</span></div>
                        <div class="quote-item"><label>货物重量</label><span class="value" id="storageWeight">-</span></div>
                    </div>
                    <div class="quote-card">
                        <h3>💵 费用明细</h3>
                        <div class="quote-item line-field"><label>干线运费</label><span class="value" id="lineCost">-</span></div>
                        <div class="quote-item delivery-fee-field"><label>配送费用</label><span class="value" id="deliveryModeCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>冷藏费</label><span class="value" id="coldStorageCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>处置费</label><span class="value" id="disposalCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>搬运费（入库）</label><span class="value" id="handlingInCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>搬运费（出库）</label><span class="value" id="handlingOutCost">-</span></div>
                        <div class="quote-item storage-field hidden"><label>打膜费</label><span class="value" id="filmCost">-</span></div>
                        <div class="quote-item delivery-cost-field hidden"><label>共配费用</label><span class="value" id="deliveryCost">-</span></div>
                    </div>
                    <div id="timingSection" class="quote-card">
                        <h3>⏱️ 预计时效</h3>
                        <div class="quote-item">
                            <label>目的地</label>
                            <span class="value" id="timingDestination">-</span>
                        </div>
                        <div class="quote-item">
                            <label>预计到达天数</label>
                            <span class="value highlight" id="timingDays">-</span>
                        </div>
                        <div class="quote-item">
                            <label>物流方式</label>
                            <span class="value" id="timingLogistics">-</span>
                        </div>
                        <div class="quote-item pickup-address-field">
                            <label>提货地址</label>
                            <span class="value" id="pickupAddress">-</span>
                        </div>
                    </div>
                    <div class="total-row quote-item">
                        <label>💰 合计报价</label>
                        <span class="value" id="totalCost">-</span></div>
                    <div class="info-box">⚠️ 以上报价仅供参考，最终报价以客服确认为准。时效为预计天数，实际到达时间可能受天气、路况等因素影响。</div>
                    <div class="info-box" style="margin-top:10px;background:#f8f9fa;">📌 以上报价为全年固定零担价格，不含税，开票需要加收9%税点。</div>
                </div>
                <div id="emptyState" style="text-align: center; padding: 40px 0;">
                    <div style="font-size: 4rem; margin-bottom: 15px;">📭</div>
                    <p style="color: #999;">请选择报价类型并输入货物信息</p>
                    <p style="color: #ccc; font-size: 0.9rem;">点击计算按钮获取报价</p>
                </div>
            </div>
        </div>
    </div>

        function calculateQuote() {
            const quoteType = document.querySelector('input[name="quoteType"]:checked').value;
            const deliveryMode = document.querySelector('input[name="deliveryMode"]:checked').value;
            const destination = document.getElementById('destination').value.trim();
            const weight = parseFloat(document.getElementById('weight').value) || 0;
            const volume = parseFloat(document.getElementById('volume').value) || 0;
            const pieces = parseInt(document.getElementById('pieces').value) || 0;
            const storageDays = parseInt(document.getElementById('storageDays').value) || 1;
            const storagePallets = parseInt(document.getElementById('storagePallets').value) || 1;

            if (quoteType !== 'storage' && !destination) { alert('请输入目的地'); return; }
            if (weight <= 0 && volume <= 0) { alert('请输入重量或体积'); return; }

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('resultSection').classList.add('active');

            let lineCost = 0, deliveryModeCost = 0, deliveryCost = 0;
            let coldStorageCost = 0, disposalCost = 0, handlingInCost = 0, handlingOutCost = 0, filmCost = 0;
            let totalCost = 0;

            if (quoteType === 'line') {
                const quote = quoteData.lineQuotes[destination];
                if (!quote) { alert('未找到该城市的报价信息'); return; }

                // 泡货判断：1吨 > 3立方（密度 < 333.33kg/方）
                let isBulkyGoods = false;
                if (weight > 0 && volume > 0) {
                    const density = weight / volume;
                    isBulkyGoods = density < 333.33;
                } else if (volume > 0) {
                    isBulkyGoods = true; // 只有体积信息时，默认为泡货
                }

                const weightPieces = Math.ceil(weight / 10);
                const volumePieces = Math.ceil(volume / 0.03);

                let chargePieces, chargeMethodText, lineCost;
                
                if (weightPieces >= 30 || volumePieces >= 30) {
                    if (isBulkyGoods) {
                        chargePieces = volumePieces;
                        chargeMethodText = `泡货按体积计费: ${volume}方 × ¥${quote.perCubic}/方`;
                        lineCost = Math.ceil(volume) * quote.perCubic;
                    } else {
                        chargePieces = weightPieces;
                        const tons = weight / 1000;
                        chargeMethodText = `重货按吨计费: ${tons.toFixed(2)}吨 × ¥${quote.over500kg}/吨`;
                        lineCost = tons * quote.over500kg;
                    }
                } else {
                    chargePieces = Math.max(weightPieces, volumePieces, pieces);
                    
                    let unitPrice, rangeText;
                    if (chargePieces === 1) {
                        unitPrice = quote.firstPiece;
                        rangeText = '首件';
                        chargeMethodText = `首件价¥${unitPrice}`;
                        lineCost = unitPrice;
                    } else if (chargePieces <= 9) {
                        unitPrice = quote.extra2_9;
                        rangeText = '2-9件区间';
                        chargeMethodText = `首件价¥${quote.firstPiece} + ${chargePieces - 1}件×续件单价¥${unitPrice}/件`;
                        lineCost = quote.firstPiece + (chargePieces - 1) * unitPrice;
                    } else if (chargePieces <= 15) {
                        unitPrice = quote.extra10_15;
                        rangeText = '10-15件区间';
                        chargeMethodText = `首件价¥${quote.firstPiece} + ${chargePieces - 1}件×续件单价¥${unitPrice}/件`;
                        lineCost = quote.firstPiece + (chargePieces - 1) * unitPrice;
                    } else if (chargePieces <= 30) {
                        unitPrice = quote.extra16_30;
                        rangeText = '16-30件区间';
                        chargeMethodText = `首件价¥${quote.firstPiece} + ${chargePieces - 1}件×续件单价¥${unitPrice}/件`;
                        lineCost = quote.firstPiece + (chargePieces - 1) * unitPrice;
                    } else {
                        unitPrice = quote.extra31_50;
                        rangeText = '31-50件区间';
                        chargeMethodText = `首件价¥${quote.firstPiece} + ${chargePieces - 1}件×续件单价¥${unitPrice}/件`;
                        lineCost = quote.firstPiece + (chargePieces - 1) * unitPrice;
                    }
                }

                document.getElementById('actualWeight').textContent = weight + ' kg';
                document.getElementById('actualVolume').textContent = volume + ' 方';
                document.getElementById('weightPieces').textContent = weightPieces + ' 件';
                document.getElementById('volumePieces').textContent = volumePieces + ' 件';
                document.getElementById('chargePieces').textContent = chargePieces + ' 件';
                document.getElementById('chargeMethod').textContent = chargeMethodText;

                lineCost = Math.round(lineCost);
                document.getElementById('lineCost').textContent = '¥' + lineCost;

                if (deliveryMode === 'self') {
                    deliveryModeCost = 0;
                    document.querySelector('.quote-item.delivery-fee-field').classList.add('hidden');
                } else {
                    document.querySelector('.quote-item.delivery-fee-field').classList.remove('hidden');
                    if (deliveryMode === 'normal') {
                        const isNortheast = northeastCities.includes(destination);
                        const isNorthwest = northwestCities.includes(destination);
                        const isShandong = shandongCities.includes(destination);
                        
                        if (isNortheast || isNorthwest || isShandong) {
                            deliveryModeCost = 300;
                            document.getElementById('deliveryModeCost').textContent = '¥300 (30km内，超出加¥3/公里)';
                        } else {
                            if (weight >= 3000) {
                                deliveryModeCost = 0;
                                document.getElementById('deliveryModeCost').textContent = '¥0 (30km内免费，超出加¥3/公里)';
                            } else {
                                if (weight <= 500) {
                                    deliveryModeCost = 100;
                                    document.getElementById('deliveryModeCost').textContent = '¥100 (30km内，超出加¥3/公里)';
                                } else if (weight <= 1000) {
                                    deliveryModeCost = 150;
                                    document.getElementById('deliveryModeCost').textContent = '¥150 (30km内，超出加¥3/公里)';
                                } else {
                                    const extraTons = Math.ceil((weight - 1000) / 1000);
                                    deliveryModeCost = Math.min(150 + extraTons * 100, 200);
                                    document.getElementById('deliveryModeCost').textContent = `¥${deliveryModeCost} (30km内，超出加¥3/公里)`;
                                }
                            }
                        }
                    } else if (deliveryMode === 'temp') {
                        if (tempDiscountCities.includes(destination)) {
                            deliveryModeCost = 300;
                            document.getElementById('deliveryModeCost').textContent = '¥300 (50km内，超出加¥3/公里)';
                        } else {
                            deliveryModeCost = 400;
                            document.getElementById('deliveryModeCost').textContent = '¥400 (50km内，超出加¥3/公里)';
                        }
                    }
                }

                totalCost = lineCost + deliveryModeCost;

            } else if (quoteType === 'delivery') {
                const region = quoteData.regionMap[destination];
                if (!region) { alert('未找到该城市的区域信息'); return; }

                const deliveryQuote = quoteData.deliveryQuotes[region];
                let calcWeight = weight;
                if (volume > 0.6) {
                    const volumeWeight = volume * 333.33;
                    calcWeight = Math.max(weight, volumeWeight);
                }

                document.getElementById('deliveryRegion').textContent = region;
                document.getElementById('deliveryWeight').textContent = calcWeight.toFixed(2) + ' kg';
                const basePriceText = destination === '云浮' ? '¥' + deliveryQuote.basePrice + '（具体价格联系客服）' : '¥' + deliveryQuote.basePrice;
                document.getElementById('deliveryBasePrice').textContent = basePriceText;
                document.getElementById('deliveryUnitPrice').textContent = '¥' + deliveryQuote.unitPrice + '/kg';

                if (calcWeight <= 200) deliveryCost = deliveryQuote.basePrice;
                else deliveryCost = deliveryQuote.basePrice + Math.ceil(calcWeight - 200) * deliveryQuote.unitPrice;

                deliveryCost = Math.round(deliveryCost);
                document.getElementById('deliveryCost').textContent = '¥' + deliveryCost;

                document.querySelector('.quote-item.delivery-fee-field').classList.add('hidden');

                totalCost = deliveryCost;

            } else if (quoteType === 'storage') {
                coldStorageCost = storageDays * storagePallets * 8;
                disposalCost = Math.ceil(weight / 1000) * 50;
                handlingInCost = storagePallets * 30;
                handlingOutCost = storagePallets * 30;
                filmCost = storagePallets * 15;

                document.getElementById('storageDaysResult').textContent = storageDays + ' 天';
                document.getElementById('storagePalletsResult').textContent = storagePallets + ' 板';
                document.getElementById('storageWeight').textContent = weight + ' kg';
                document.getElementById('coldStorageCost').textContent = '¥' + coldStorageCost;
                document.getElementById('disposalCost').textContent = '¥' + disposalCost;
                document.getElementById('handlingInCost').textContent = '¥' + handlingInCost;
                document.getElementById('handlingOutCost').textContent = '¥' + handlingOutCost;
                document.getElementById('filmCost').textContent = '¥' + filmCost;

                totalCost = coldStorageCost + disposalCost + handlingInCost + handlingOutCost + filmCost;
            }

            document.getElementById('totalCost').textContent = '¥' + totalCost;

            let timing;
            if (quoteType === 'delivery') {
                timing = quoteData.deliveryTimingMap[destination] || { days: '-', logistics: '共配' };
            } else {
                timing = quoteData.timingMap[destination] || { days: '-', logistics: '-' };
            }
            document.getElementById('timingDestination').textContent = destination;
            document.getElementById('timingDays').textContent = timing.days === '当天' ? '当天' : timing.days + ' 天';
            document.getElementById('timingLogistics').textContent = timing.logistics;

            const pickupAddr = quoteData.pickupAddressMap[destination] || '-';
            document.getElementById('pickupAddress').textContent = pickupAddr;
            
            if (quoteType === 'line') {
                if (deliveryMode === 'self') {
                    document.querySelector('.quote-item.pickup-address-field').classList.remove('hidden');
                } else {
                    document.querySelector('.quote-item.pickup-address-field').classList.add('hidden');
                }
            }
        }

        function handleQuoteTypeChange() {
            const quoteType = document.querySelector('input[name="quoteType"]:checked').value;
            document.querySelectorAll('.line-field').forEach(f => f.classList.toggle('hidden', quoteType !== 'line'));
            document.querySelectorAll('.storage-field').forEach(f => f.classList.toggle('hidden', quoteType !== 'storage'));
            document.querySelectorAll('.delivery-field').forEach(f => f.classList.toggle('hidden', quoteType !== 'delivery'));
            document.querySelectorAll('.delivery-cost-field').forEach(f => f.classList.toggle('hidden', quoteType !== 'delivery'));
            document.querySelectorAll('.delivery-fee-field').forEach(f => f.classList.toggle('hidden', quoteType === 'storage' || quoteType === 'delivery' || quoteType === 'line'));
            document.querySelectorAll('.pickup-address-field').forEach(f => f.classList.toggle('hidden', quoteType === 'storage' || quoteType === 'delivery'));
            document.querySelectorAll('.destination-field').forEach(f => f.classList.toggle('hidden', quoteType === 'storage'));
            document.getElementById('deliveryModeGroup').classList.toggle('hidden', quoteType === 'storage');
            document.getElementById('timingSection').classList.toggle('hidden', quoteType === 'storage');
            
            if (quoteType === 'delivery') {
                document.querySelectorAll('.delivery-mode-item').forEach(item => item.classList.remove('active'));
                const normalItem = document.querySelector('input[name="deliveryMode"][value="normal"]').closest('.delivery-mode-item');
                normalItem.classList.add('active');
                document.querySelector('input[name="deliveryMode"][value="normal"]').checked = true;
                document.querySelectorAll('.delivery-mode-item').forEach(item => {
                    const radio = item.querySelector('input[name="deliveryMode"]');
                    if (radio && radio.value !== 'normal') {
                        item.classList.add('disabled');
                    }
                });
            } else {
                document.querySelectorAll('.delivery-mode-item').forEach(item => {
                    item.classList.remove('disabled');
                });
            }
            
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('resultSection').classList.remove('active');
            document.getElementById('destination').value = '';
        }

            document.querySelectorAll('input[name="quoteType"]').forEach(r => {
                r.addEventListener('change', function() {
                    document.querySelectorAll('.quote-type-item').forEach(item => item.classList.remove('active'));

            document.querySelectorAll('input[name="deliveryMode"]').forEach(r => {
                r.addEventListener('change', function() {
                    document.querySelectorAll('.delivery-mode-item').forEach(item => item.classList.remove('active'));
                    this.closest('.delivery-mode-item').classList.add('active');
                });
            });
        }

        function setupAutocomplete() {
            const input = document.getElementById('destination');
            const list = document.getElementById('autocompleteList');
            let currentCities = lineCities;

            document.querySelectorAll('input[name="quoteType"]').forEach(r => {
                r.addEventListener('change', () => {
                    currentCities = r.value === 'delivery' ? guangdongCities : lineCities;
                    input.value = '';
                    list.classList.remove('active');
                });
            });

            input.addEventListener('input', () => {
                const val = input.value.toLowerCase();
                list.innerHTML = '';
                if (!val) { list.classList.remove('active'); return; }

                const matches = currentCities.filter(c => c.toLowerCase().includes(val)).slice(0, 10);
                if (matches.length) {
                    matches.forEach(city => {
                        const item = document.createElement('div');
                        item.className = 'autocomplete-item';
                        item.textContent = city;
                        item.addEventListener('click', () => { input.value = city; list.classList.remove('active'); });
                        list.appendChild(item);
                    });
                    list.classList.add('active');
                } else list.classList.remove('active');
            });

            document.addEventListener('click', e => {
                if (!input.contains(e.target) && !list.contains(e.target)) list.classList.remove('active');
            });
        }

        setupAutocomplete();
        setupRadioToggle();
        
        // 初始化默认选中项的active类
        document.querySelector('input[name="quoteType"]:checked').closest('.quote-type-item').classList.add('active');
        document.querySelector('input[name="deliveryMode"]:checked').closest('.delivery-mode-item').classList.add('active');
        
        document.querySelectorAll('input[name="quoteType"]').forEach(r => r.addEventListener('change', handleQuoteTypeChange));
    </script>
</body>
</html>
